<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} — {{ site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
  <meta name="description" content="{{ page.description | default: page.excerpt | strip_html | truncate: 160 }}">
  {% seo %}
</head>
<body>
  <nav>
    <a href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <span class="tagline">{{ site.tagline }}</span>
  </nav>
  <main>
    <article>
      <header>
        <h1>{{ page.title }}</h1>
        <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %d, %Y" }}</time>
      </header>
      {{ content }}
    </article>
    <hr>
    <p><a href="{{ '/' | relative_url }}">← Back to posts</a></p>
  </main>
  <footer>
    <p>&copy; {{ site.time | date: '%Y' }} Joshua Herron &middot; <a href="https://github.com/Costder">GitHub</a> &middot; <a href="{{ '/feed.xml' | relative_url }}">RSS</a></p>
  </footer>
</body>
</html>
